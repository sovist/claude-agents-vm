# The proxy and the agent template. Run through the scripts (agents.sh, agent.sh, allow.sh), which load
# config.env and add project/compose.yaml, where a project adds its own settings (docs/project-hooks.md).
name: agents

networks:
  # No route to the outside world; the proxy is the only way out.
  agents-internal:
    internal: true
  egress: {}

services:
  proxy:
    build: ./proxy
    image: agents/proxy
    restart: unless-stopped
    networks: [agents-internal, egress]
    volumes:
      # Folders, not single files: editors that save by replacing the file would otherwise leave the proxy
      # reading the old copy. proxy/ has the base allow-list, project/ the project's own hosts.
      - ./proxy:/etc/tinyproxy/host:ro
      - ./project:/etc/tinyproxy/project:ro

  agent:
    build:
      context: ./agent
      additional_contexts:
        project: ./project
      args:
        AGENT_BASE_IMAGE: ${AGENT_BASE_IMAGE:-ubuntu:24.04}
    image: agents/agent
    # Not started by "docker compose up"; each agent is started with ./agent.sh <name>.
    profiles: [agent]
    depends_on: [proxy]
    networks: [agents-internal]
    init: true
    stdin_open: true
    tty: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,proxy
      no_proxy: localhost,127.0.0.1,proxy
      # Git over HTTPS to GIT_HOST authenticates with secrets/git-token (see the Dockerfile).
      GIT_HOST: ${GIT_HOST:-}
      GIT_HOST_USERNAME: ${GIT_HOST_USERNAME:-}
      # Agents' commits are authored as configured. Environment variables take precedence over git config,
      # so an agent's own "git config user.*" can't change this.
      GIT_AUTHOR_NAME: ${AGENT_GIT_NAME:?Set AGENT_GIT_NAME in config.env}
      GIT_AUTHOR_EMAIL: ${AGENT_GIT_EMAIL:?Set AGENT_GIT_EMAIL in config.env}
      GIT_COMMITTER_NAME: ${AGENT_GIT_NAME:?Set AGENT_GIT_NAME in config.env}
      GIT_COMMITTER_EMAIL: ${AGENT_GIT_EMAIL:?Set AGENT_GIT_EMAIL in config.env}
      # Used by the jira and confluence commands; empty turns them off.
      ATLASSIAN_SITE: ${ATLASSIAN_SITE:-}
      ATLASSIAN_CLOUD_ID: ${ATLASSIAN_CLOUD_ID:-}
      # A Rider backend in an agent is stopped after this many minutes with nothing connected
      # (rider-idle-stop in the image; agents started with agent.sh only).
      RIDER_IDLE_MINUTES: ${RIDER_IDLE_MINUTES:-10}
    volumes:
      # The project's files, live: its commands in /opt/project/bin are on PATH, and data such as a test
      # baseline can change without rebuilding the image. Read-only for the agent.
      - ./project:/opt/project:ro

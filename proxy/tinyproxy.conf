User tinyproxy
Group tinyproxy
Port 3128
Timeout 600
MaxClients 200

# Connect level logs every request with its target host, so blocked domains show up in
# "docker compose logs proxy". No LogFile/Syslog: logs go to the container output.
LogLevel Connect

Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

DisableViaHeader Yes

# Only hosts matching a line of the merged allow-list (see merge-filter) get through; everything else is refused.
Filter "/tmp/allowed-domains.txt"
FilterType fnmatch
FilterDefaultDeny Yes
FilterURLs Off

# HTTPS tunnels only on port 443.
ConnectPort 443
